<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Tostçu Gugi</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
input{user-select:text!important;-webkit-user-select:text!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:#2b1a10;font-family:'Fredoka',system-ui,sans-serif;color:#3b2414;overscroll-behavior:none}
#app{height:100dvh;max-width:560px;margin:0 auto;display:flex;flex-direction:column;position:relative;overflow:hidden;background:#f4e3c3}
#hud{display:flex;align-items:center;gap:4px;padding:6px 6px;background:#7a3e1d;color:#fff4e0;font-weight:600;font-size:14px;z-index:3}
#hud .pill{background:#5a2c13;border-radius:999px;padding:3px 7px;white-space:nowrap;font-size:13px}
#hud .money{color:#ffd76a}
#hud .sp{flex:1}
#hud button{background:#5a2c13;border:0;color:#fff4e0;border-radius:999px;width:30px;height:28px;flex:none;font-size:15px;cursor:pointer}
#scene{position:relative;flex:none;width:100%;aspect-ratio:400/270;max-height:42dvh;overflow:hidden;background:#f6dfb5}
#scene>svg{position:absolute;inset:0;width:100%;height:100%}
#bubble{position:absolute;right:2%;top:24%;width:44%;background:#fff;border-radius:16px;padding:9px 11px;font-size:14px;line-height:1.3;box-shadow:0 4px 0 rgba(0,0,0,.18);opacity:0;transform:scale(.6);transform-origin:left bottom;transition:.25s;pointer-events:none;z-index:2}
#bubble.left{right:auto;left:2%;transform-origin:right bottom}
#bubble.left:after{left:auto;right:-10px;border-right-color:transparent;border-left:10px solid #fff;border-right:0}
#hPartner{display:none;position:absolute;left:6px;bottom:6px;background:rgba(75,42,122,.88);color:#fff;font-size:11px;padding:3px 8px;border-radius:999px;z-index:2}
#bubble.show{opacity:1;transform:scale(1);pointer-events:auto}
#bubble:after{content:"";position:absolute;left:-10px;bottom:16px;border:10px solid transparent;border-right-color:#fff;border-left:0}
#bubble .nm{font-size:11px;color:#a0663a;font-weight:600;margin-bottom:2px}
#station{flex:1;display:flex;flex-direction:column;align-items:center;padding:6px 10px 10px;position:relative;min-height:0;background:radial-gradient(circle at 20% 30%,rgba(255,255,255,.25),transparent 40%),#e9d2a8}
#strip{width:100%;display:flex;align-items:center;gap:8px;min-height:24px}
#note{flex:1;background:#fffbd0;padding:3px 8px;font-size:12px;line-height:1.25;border-radius:4px;box-shadow:0 2px 4px rgba(0,0,0,.15);visibility:hidden}
#stepTitle{font-weight:700;font-size:14px;color:#7a3e1d;white-space:nowrap}
#view{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;position:relative}
#view>svg,#view>div>svg{max-height:100%;max-width:100%}
#controls{width:100%}
.btn{font-family:inherit;font-weight:600;font-size:16px;border:0;border-radius:14px;padding:11px 16px;background:#e2433a;color:#fff;box-shadow:0 4px 0 #a52a22;cursor:pointer;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #a52a22}
.btn.g{background:#3fa34d;box-shadow:0 4px 0 #2a7434}.btn.g:active{box-shadow:0 1px 0 #2a7434}
.btn.y{background:#f2b13a;color:#4a2a0a;box-shadow:0 4px 0 #b47d1c}.btn.y:active{box-shadow:0 1px 0 #b47d1c}
.btn.s{background:#fff;color:#7a3e1d;box-shadow:0 4px 0 #c9a77a}.btn.s:active{box-shadow:0 1px 0 #c9a77a}
.btn:disabled{opacity:.45}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.row .btn{flex:1}
#bins{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.bin{position:relative;background:#fff;border:3px solid transparent;border-radius:12px;padding:2px 1px 2px;box-shadow:0 3px 0 #c9a77a;font-family:inherit;font-size:11px;font-weight:600;color:#7a3e1d;cursor:pointer}
.bin.sel{border-color:#e2433a;background:#fff3e6}
.bin svg{width:100%;height:30px;display:block}
.bin .c{position:absolute;top:-7px;right:-5px;background:#3fa34d;color:#fff;border-radius:999px;font-size:10px;padding:0 5px;height:17px;line-height:17px;display:none}
.bin .c.on{display:block}
.bin.locked{opacity:.35;pointer-events:none}
.hint{position:absolute;top:4px;left:50%;transform:translateX(-50%);background:rgba(122,62,29,.88);color:#fff;font-size:12px;padding:4px 10px;border-radius:999px;pointer-events:none;white-space:nowrap;transition:opacity .4s}
#breadSvg{touch-action:none;cursor:crosshair}
.bar{position:relative;height:30px;border-radius:999px;overflow:hidden;border:3px solid #5a2c13}
.bar .z{position:absolute;top:0;bottom:0;border-left:2px dashed rgba(255,255,255,.75);font-size:10px;color:#fff;padding-left:3px;font-weight:700;text-shadow:0 1px 1px #000;line-height:24px}
.marker{position:absolute;top:-4px;bottom:-4px;width:6px;background:#fff;border:2px solid #000;border-radius:3px;left:0;margin-left:-3px}
.steam{position:absolute;width:18px;height:18px;border-radius:50%;background:rgba(255,255,255,.75);filter:blur(3px);animation:steam 1.4s linear infinite;opacity:0}
@keyframes steam{0%{transform:translateY(0) scale(.6);opacity:0}20%{opacity:.9}100%{transform:translateY(-70px) scale(1.6);opacity:0}}
.bub{animation:bub 1s linear infinite}
@keyframes bub{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-14px);opacity:0}}
.pop{position:absolute;font-weight:700;font-size:22px;color:#2a7434;text-shadow:0 2px 0 #fff;animation:pop 1.6s ease-out forwards;pointer-events:none;z-index:5;white-space:nowrap}
@keyframes pop{0%{transform:translateY(10px) scale(.6);opacity:0}15%{transform:translateY(0) scale(1.1);opacity:1}100%{transform:translateY(-60px);opacity:0}}
.stars{font-size:26px;letter-spacing:2px;color:#f2b13a;text-shadow:0 2px 0 #b47d1c}
.stars .off{color:#d8c3a0;text-shadow:none}
.modal{position:absolute;inset:0;background:rgba(43,26,16,.7);display:none;align-items:center;justify-content:center;z-index:10;padding:16px}
.modal.show{display:flex}
.card{background:#fff6e6;border-radius:20px;padding:18px;width:100%;max-width:420px;max-height:92%;overflow:auto;box-shadow:0 8px 0 #c9a77a;text-align:center}
.card h2{margin:0 0 6px;color:#7a3e1d}
.card p{margin:6px 0}
.shopItem{display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;padding:8px 10px;margin:8px 0;text-align:left;box-shadow:0 3px 0 #e2cba5}
.shopItem .ic{width:44px;height:44px;flex:none;display:flex;align-items:center;justify-content:center;font-size:28px}
.shopItem .ic svg{width:44px;height:44px}
.shopItem .tx{flex:1;font-size:14px}
.shopItem .tx small{display:block;color:#a0663a;font-size:12px}
.shopItem .btn{font-size:14px;padding:8px 12px}
.title-logo{font-size:36px;font-weight:700;color:#e2433a;text-shadow:0 3px 0 #7a3e1d;line-height:1.05;margin:4px 0 8px}
.wiggle{animation:wig .5s}
@keyframes wig{25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
.neon{animation:flick 3s infinite}
.idle{animation:breathe 3.4s ease-in-out infinite}
@keyframes breathe{50%{transform:translateY(-1.5px)}}
.eyes{animation:blink 5s infinite;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.08)}}
.bin .st{display:block;font-size:10px;color:#a0663a;font-weight:500;line-height:1}
.bin.empty{opacity:.45}
.bin.empty .st{color:#e2433a;font-weight:700}
.shopCard{display:flex;align-items:center;gap:10px;background:#fff;border-radius:16px;padding:10px;margin:8px 0;text-align:left;box-shadow:0 3px 0 #e2cba5}
.shopCard .em{font-size:34px;width:46px;text-align:center}
.shopCard .tx{flex:1;font-size:14px}.shopCard .tx small{display:block;color:#a0663a;font-size:12px}
.setRow{display:flex;align-items:center;gap:6px;margin:6px 0;background:#fff;border-radius:12px;padding:6px 8px;box-shadow:0 2px 0 #e2cba5}
.setRow .lb{flex:1;text-align:left;font-weight:600;font-size:14px}
.setRow button{font-family:inherit;font-weight:600;border:0;border-radius:10px;padding:7px 10px;background:#f1e2c6;color:#7a3e1d;cursor:pointer}
.setRow button.on{background:#3fa34d;color:#fff}
#hClock.ot{background:#4b2a7a;color:#e6d4ff}
.toastMsg{position:absolute;left:50%;top:40%;transform:translateX(-50%);background:#7a3e1d;color:#fff;padding:8px 14px;border-radius:12px;font-weight:600;z-index:6;animation:pop 1.8s ease-out forwards;white-space:nowrap}
@keyframes flick{0%,92%,100%{opacity:1}94%{opacity:.5}96%{opacity:1}97%{opacity:.6}}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <span class="pill" id="hDay">Gün 1</span>
    <span class="pill money" id="hMoney">₺0</span>
    <span class="pill" id="hClock">🕘 09:00</span>
    <span class="pill" id="hCust">👤 0</span>
    <span class="pill" id="hRep">⭐3.0</span>
    <span class="sp"></span>
    <button id="btnShop" title="Market">🛒</button>
    <button id="btnClose" title="Dükkânı kapat">🌙</button>
    <button id="btnMute" title="Ses">🔊</button>
  </div>
  <div id="scene"><div id="bubble"></div><div id="hPartner"></div></div>
  <div id="station">
    <div id="strip"><div id="note"></div><div id="stepTitle"></div></div>
    <div id="view"></div>
    <div id="controls"></div>
  </div>

  <div class="modal show" id="mStart"><div class="card" id="startCard"></div></div>
  <div class="modal" id="mRent"><div class="card" id="rentCard"></div></div>
  <div class="modal" id="mDay"><div class="card" id="dayCard"></div></div>
  <div class="modal" id="mShop"><div class="card" id="shopCard"></div></div>
</div>

<script>
// ================= DATA =================
const ING = {
  kasar:  {n:'Kaşar',adj:'kaşarlı',cheese:1,tap:1,rad:3,N:2},
  sucuk:  {n:'Sucuk',adj:'sucuklu',meat:1,red:1,tap:1,rad:0,N:6},
  domates:{n:'Domates',adj:'domatesli',red:1,tap:1,rad:0,N:4},
  salam:  {n:'Salam',adj:'salamlı',meat:1,red:1,unlock:40,tap:1,rad:0,N:4},
  biber:  {n:'Biber',adj:'biberli',unlock:30,tap:1,rad:0,N:6},
  beyaz:  {n:'Beyaz P.',full:'Beyaz peynir',adj:'beyaz peynirli',cheese:1,unlock:45,tap:3,rad:12,N:15,u:5},
  tursu:  {n:'Turşu',adj:'turşulu',unlock:50,tap:1,rad:0,N:5},
  ketcap: {n:'Ketçap',adj:'ketçaplı',sauce:1,red:1,unlock:35,N:300,u:5},
  mayonez:{n:'Mayonez',adj:'mayonezli',sauce:1,unlock:35,N:300,u:5},
  kekik:  {n:'Kekik',adj:'kekikli',unlock:25,tap:1,rad:0,N:6},
};
const UNITS=k=>ING[k].u||ING[k].N;
const STOCK={ekmek:{n:'Tost ekmeği',ic:'🍞',price:20},kasar:{price:30},sucuk:{price:40},domates:{price:15},patates:{n:'Patates',ic:'🥔',price:25},salam:{price:30},biber:{price:15},beyaz:{price:25},tursu:{price:15},ketcap:{price:15},mayonez:{price:15},kekik:{price:10},ayran:{n:'Ayran',ic:'🥛',price:25}};
const SHOPS={
  mahalle:{n:'Mahalle Büfesi',em:'🏘️',rent:25,mult:1,d:'Sakin mahalle, ucuz kira.',th:{wall:'#f6dfb5',stripe:'#f1d6a6',wain:'#c9844a',wainD:'#8b4520',f1:'#f3dfb8',f2:'#e7cfa3',win:'park'}},
  carsi:{n:'Çarşı Dükkânı',em:'🏙️',rent:60,mult:1.35,d:'Kalabalık çarşı, müşteriler ×1.35 öder.',th:{wall:'#e9eef1',stripe:'#dde5ea',wain:'#5b7a8c',wainD:'#3c5564',f1:'#efefef',f2:'#d5d5d5',win:'city'}},
  sahil:{n:'Sahil Kafesi',em:'🏖️',rent:110,mult:1.7,d:'Deniz manzarası, müşteriler ×1.7 öder.',th:{wall:'#e4f4f6',stripe:'#d2ecf0',wain:'#2f8fa3',wainD:'#1f6676',f1:'#f7efe0',f2:'#e8dbc1',win:'sea'}},
  avm:{n:'AVM Yemek Katı',em:'🏬',rent:180,mult:2.1,d:'Çok işlek, müşteriler ×2.1 öder.',th:{wall:'#f3ebf6',stripe:'#e9ddef',wain:'#6b4b8a',wainD:'#4a3163',f1:'#fafafa',f2:'#e3e3ec',win:'mall'}},
};
const KEYS=Object.keys(ING);
const UPG={
  cicek:{n:'Saksı Çiçeği',d:'+%10 bahşiş',price:60,ic:'🪴'},
  radyo:{n:'Eski Radyo',d:'+%15 bahşiş',price:100,ic:'📻'},
  tabela:{n:'Neon Tabela',d:'Tabela parlar, müşteriler +%10 öder',price:160,ic:'✨'},
  cay:{n:'Semaver',d:'+%20 bahşiş',price:220,ic:'🫖'},
};
const NAMES={f:{old:['Ayşe Teyze','Fatma Teyze','Hatice Teyze','Emine Hanım','Nuriye Teyze'],mid:['Zeynep Hanım','Derya Hanım','Gül Abla','Sevgi Hanım','Nermin Hanım'],young:['Elif','Selin','Melis','Ece','Defne','İrem','Öğrenci Nisa']},
 m:{old:['Hasan Amca','Rıza Amca','Kemal Usta','Hüseyin Dede','Profesör Bey'],mid:['Mehmet Abi','Murat Bey','Ali Usta','Serkan Bey','Taksici Cemil'],young:['Can','Burak','Kaan','Emre','Öğrenci Arda','Mert']}};
const GREET={old:{f:['Kolay gelsin yavrum!','Hayırlı işler evladım!','Kızım/oğlum, bir tost yapıver.'],m:['Hayırlı işler evlat!','Selamünaleyküm usta!','Kolay gelsin delikanlı!']},mid:['İyi günler!','Kolay gelsin!','Hayırlı işler!','Merhaba, nasılsınız?'],young:['Selam!','Selam usta!','Merhaba!','Ooo, ne güzel kokuyor!','Naber usta?']};
const CUTS={none:'Kesme',half:'Ortadan',diag:'Çapraz',quad:'4 Parça'};
const CUT_TXT={none:'kesmeden verin',half:'ortadan kesin',diag:'çapraz kesin, üçgen olsun',quad:'dört parçaya bölün'};
const DONE_TXT={az:'az pişmiş olsun',normal:'',iyi:'iyice kızarsın, çıtır olsun'};
const DONE_T={az:.44,normal:.66,iyi:.88};

const FRESH=()=>({money:50,day:1,unl:{},upg:{},best:0,stock:{},started:false,rep:3,shopName:'Tostçu Gugi'});
let S=FRESH();
const ON={active:false,role:null,conn:null,peer:null,lane:'L',ghosts:{},pstep:null,pserved:0};
try{const raw=localStorage.getItem('tostcuGugi_v3');if(raw)S=Object.assign(S,JSON.parse(raw));}catch(e){}
if(S.rep==null)S.rep=3;if(!S.shopName)S.shopName='Tostçu Gugi';
const shortName=()=>S.shopName.split(/\s+/).pop().toLocaleUpperCase('tr-TR').slice(0,8);
function save(){if(ON.active)return;try{localStorage.setItem('tostcuGugi_v3',JSON.stringify(S))}catch(e){}}
let clock=540,dayRent=0;
const fmtT=m=>String(Math.floor(m/60)%24).padStart(2,'0')+':'+String(m%60|0).padStart(2,'0');
const overtime=()=>clock>=18*60;
const st=k=>S.stock[k]||0;
const isUnl=k=>!ING[k].unlock||S.unl[k];
let cust=null,order=null,toast=null,side=null,step='idle',served=0,dayEarn=0,dayStars=[],uid=0,busy=false;
const payMult=()=>(SHOPS[S.shop]?SHOPS[S.shop].mult:1)*(S.upg.tabela?1.1:1);
const tipBoost=()=>(S.upg.cicek?.1:0)+(S.upg.radyo?.15:0)+(S.upg.cay?.2:0)+(overtime()?.15:0);
const R=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const $=id=>document.getElementById(id);
const esc=t=>String(t).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));

// ================= AUDIO =================
let AC=null,muted=false,loopSnd=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function beep(f,d=.12,type='sine',v=.15,delay=0){const a=ac();if(!a||muted)return;const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=f;const t=a.currentTime+delay;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.02)}
let lastPop=0;
const sfx={
  pop:()=>beep(520+Math.random()*200,.08,'triangle',.12),
  soft:()=>{const n=performance.now();if(n-lastPop<70)return;lastPop=n;beep(700+Math.random()*300,.04,'triangle',.05)},
  ding:()=>{beep(1046,.25,'sine',.15);beep(1318,.35,'sine',.12,.12)},
  coin:()=>{beep(988,.08,'square',.06);beep(1319,.25,'square',.06,.08)},
  bad:()=>{beep(220,.2,'sawtooth',.08);beep(160,.3,'sawtooth',.08,.15)},
  chop:()=>beep(180,.06,'square',.1),
  bell:()=>{beep(1567,.4,'sine',.1);beep(2093,.5,'sine',.06,.05)},
  door:()=>{beep(300,.08,'square',.04);beep(240,.1,'square',.04,.08)}
};
function startLoop(kind){const a=ac();if(!a||muted)return;stopLoop();const len=a.sampleRate*2,b=a.createBuffer(1,len,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(kind==='pour'?.5:(Math.random()<.03?1:.35));const s=a.createBufferSource();s.buffer=b;s.loop=true;const f=a.createBiquadFilter();f.type=kind==='pour'?'lowpass':'highpass';f.frequency.value=kind==='pour'?900:2500;const g=a.createGain();g.gain.value=kind==='pour'?.08:.05;s.connect(f).connect(g).connect(a.destination);s.start();loopSnd={s,g}}
function stopLoop(){if(loopSnd){try{loopSnd.s.stop()}catch(e){}loopSnd=null}}

// ================= DRAWING: TOAST =================
const BREAD='M40,82 Q38,30 92,32 Q130,16 168,32 Q222,30 220,82 L220,214 Q220,228 206,228 L54,228 Q40,228 40,214 Z';
function lerpC(a,b,t){const p=x=>[1,3,5].map(i=>parseInt(x.substr(i,2),16));const A=p(a),B=p(b);return '#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('')}
function ramp(st,c){c=clamp(c,st[0][0],st[st.length-1][0]);for(let i=1;i<st.length;i++){if(c<=st[i][0]){const t=(c-st[i-1][0])/(st[i][0]-st[i-1][0]);return lerpC(st[i-1][1],st[i][1],t)}}return st[st.length-1][1]}
const cookColor=c=>ramp([[0,'#f3ddaa'],[.45,'#e9b867'],[.66,'#d48e3a'],[.85,'#a65d22'],[1,'#5e3214'],[1.2,'#1f140c']],c);
const friesColor=c=>ramp([[0,'#f7eab0'],[.5,'#f5d572'],[.72,'#efb434'],[.9,'#c97c1e'],[1.05,'#6b3a12'],[1.2,'#2a180a']],c);
function piece(t,x,y,r,s=1){
  const T=`transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${r|0}) scale(${s})"`;
  switch(t){
    case 'kasar':return `<g ${T}><rect x="-31" y="-31" width="62" height="62" rx="3" fill="#f8cb4c" stroke="#e1a826" stroke-width="1.6" opacity=".96"/><rect x="-27" y="-27" width="54" height="9" rx="3" fill="#fde49d" opacity=".55"/><rect x="-27" y="20" width="54" height="5" rx="2" fill="#e8b333" opacity=".35"/></g>`;
    case 'sucuk':return `<g ${T}><circle r="11" fill="#7f2318" stroke="#5a160e" stroke-width="2"/><circle cx="-3" cy="-2" r="2" fill="#e8b49a"/><circle cx="4" cy="3" r="1.6" fill="#e8b49a"/><circle cx="2" cy="-5" r="1.2" fill="#e8b49a"/></g>`;

function applySnap(m){
  ON.pstep=m.step;if(ON.role==='guest'&&m.clock!=null)clock=m.clock;

    if(c.mood!==gh.c.mood)gh.g.innerHTML=custG(c,c.mood);
    if(c.to&&(!gh.to||Math.abs(gh.to.x-c.to.x)+Math.abs(gh.to.y-c.to.y)>1)){gh.to=c.to;walk(gh.g,c.to,900)}

  if(m.t==='hello'){if(ON.role==='guest'){S.shopName=m.name;buildScene();hud();$('mStart').classList.remove('show');guestWait()}return}
  if(m.t==='snap')return applySnap(m);
  if(m.t==='gain'){S.money+=m.v;dayEarn+=m.v;S.rep=clamp(S.rep+m.rep,.5,5);ON.pserved=(ON.pserved||0)+1;hud();return}
  if(m.t==='spend'){S.money-=m.v;hud();return}
  if(m.t==='rep'){S.rep=clamp(S.rep+m.v,.5,5);hud();return}

     <p style="font-size:12px;color:#a0663a">Her dokunuş 1 birim harcar · Kasada ₺50 ile başlarsın</p>
     <div class="row"><button class="btn g" id="btnPlay">Başla 🍞</button></div><div class="row"><button class="btn y" id="btnOnline">🌐 Online Mod (2 şef)</button></div>`;
    $('btnOnline').onclick=()=>{ac();onlineMenu()};
    $('setName').oninput=e=>{setupName=e.target.value};
    document.querySelectorAll('[data-set]').forEach(b=>b.onclick=()=>{const [k,v]=b.dataset.set.split(':');setup[k]=+v;sfx.pop();startScreen()});
    document.querySelectorAll('[data-all]').forEach(b=>b.onclick=()=>{START_ITEMS.forEach(k=>setup[k]=+b.dataset.all);sfx.pop();startScreen()});
    $('btnPlay').onclick=()=>{ac();S=FRESH();S.started=true;S.shopName=(setupName.trim()||'Tostçu Gugi').slice(0,22);START_ITEMS.forEach(k=>S.stock[k]=setup[k]);save();$('mStart').classList.remove('show');buildScene();hud();rentModal()};
  }else{
    $('startCard').innerHTML=`<div class="title-logo">${esc(S.shopName)}</div><p>Kasa: <b style="color:#2a7434">₺${S.money}</b> · Gün ${S.day}</p><div class="row"><button class="btn g" id="btnPlay">Devam Et ☀️</button></div><div class="row"><button class="btn y" id="btnOnline">🌐 Online Mod (2 şef)</button></div><p><button class="btn s" id="btnNew" style="font-size:12px;padding:6px 10px">Yeni oyun</button></p>`;
    $('btnPlay').onclick=()=>{ac();$('mStart').classList.remove('show');rentModal()};
    $('btnOnline').onclick=()=>{ac();onlineMenu()};
    let armed=false;$('btnNew').onclick=e=>{if(!armed){armed=true;e.target.textContent='Emin misin? Tekrar dokun';return}S=FRESH();save();startScreen()};
  }
}
buildScene();
$('btnShop').onclick=()=>openShop(false);
$('btnClose').onclick=closeShop;
$('btnMute').onclick=()=>{muted=!muted;$('btnMute').textContent=muted?'🔇':'🔊';if(muted)stopLoop()};
startScreen();
hud();
</script>

</body>
</html>
